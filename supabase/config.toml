project_id = "asca-archive"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false
sql_paths = []

[studio]
enabled = false

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"

[analytics]
enabled = false

[edge_runtime]
enabled = false

# Images are public only after the handler's anon DB and private-Storage RLS checks.
[functions.public-artwork-image]
verify_jwt = false
entrypoint = "./functions/public-artwork-image/index.mjs"
